[project]
name = "pyiem"
version = "0.1.0"
description = "Iowa Electronic Markets client: sessions, orders, quotes and price history"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "lxml>=6.1",
    "numpy>=2.5",
    "pandas>=3.0",
    "requests>=2.32",
    "sqlalchemy>=2.1",
    "tables>=3.11",
]

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff", "types-requests"]
plot = ["matplotlib>=3.11"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
